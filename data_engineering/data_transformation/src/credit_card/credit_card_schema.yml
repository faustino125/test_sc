  tc_mayor_saldo_mora_gtq_val: "Acorde a reglas de negocio, si una de las 2 líneas de crédito (USD o GTQ) tiene un saldo en mora, se considera como que ambas líneas están en mora. Se coloca el saldo en mora de quetzles independientemente de si esa línea de crédito se encuentra en mora o no."
