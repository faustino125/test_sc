  tc_mayor_saldo_mora_quetzalizado_val: "Acorde a reglas de negocio, si una de las 2 líneas de crédito (USD o GTQ) tiene un saldo en mora, se considera como que ambas líneas están en mora. Se coloca la sumatoria de ambos saldos en mora independientemente de qué línea sea la que se encuentra en mora."
